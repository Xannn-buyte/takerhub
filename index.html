<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes Hub</title>
<meta http-equiv="refresh" content="0; url=https://takerhub.tailfaae8f.ts.net/login">
<style>
  :root { color-scheme: dark }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0B0C0F; color:#F2F4F8;
         font:14px/1.5 Inter,system-ui,sans-serif }
  .box { text-align:left; max-width:22rem; padding:24px }
  .dot { display:inline-block; width:8px; height:8px; border-radius:2px; background:#E8B44A }
  h1 { font-size:16px; font-weight:500; margin:0 0 8px }
  p { color:#B4BCCC; margin:0 0 16px }
  a { display:inline-block; padding:8px 16px; border-radius:8px;
      background:#E8B44A; color:#0B0C0F; text-decoration:none; font-weight:500 }
  code { color:#7C8699; font-size:11px }
</style>
</head>
<body>
  <div class="box">
    <span class="dot"></span>
    <h1 style="margin-top:12px">Hermes Hub</h1>
    <p>Mengalihkan ke server yang sedang aktif.</p>
    <a href="https://takerhub.tailfaae8f.ts.net/login">Buka dashboard</a>
    <p style="margin-top:16px"><code id="u"></code></p>
  </div>
  <script>document.getElementById('u').textContent = location.host + " · " + new Date().toISOString().slice(0,16).replace('T',' ');</script>
</body>
</html>
